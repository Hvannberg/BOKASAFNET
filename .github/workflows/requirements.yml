name: Formathugun krafna

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  requirements:
    name: Formathugun krafna
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sækja skrár
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prófa formathugun
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Athuga kröfuskjöl
        run: python3 scripts/check_requirements.py